# View the docs https://docs.anyscale.com/reference/job-api#jobconfig.
name: prasad-image-classification-m5n-g6.4xlarge-20260225-3

# When empty, use the default image. This can be an Anyscale-provided base image
# like anyscale/ray:2.43.0-slim-py312-cu125, a user-provided base image (provided
# that it meets certain specs), or you can build new images using the Anyscale
# image builder at https://console.anyscale-staging.com/v2/container-images.
# image_uri:  # anyscale/ray:2.43.0-slim-py312-cu125
#image_uri: anyscale/ray:2.53.0-slim-py312-cu129
#image_uri: 830883877497.dkr.ecr.us-west-2.amazonaws.com/anyscale/ray:prasad_rt
image_uri: 830883877497.dkr.ecr.us-west-2.amazonaws.com/anyscale/ray:sca-scale-22
#image_uri: 830883877497.dkr.ecr.us-west-2.amazonaws.com/anyscale/ray:master-a2da2a9c08
#image_uri: 830883877497.dkr.ecr.us-west-2.amazonaws.com/anyscale/ray:2.56.0-py310-cu129
#containerfile: ./Dockerfile

compute_config:
  #auto_select_worker_config: True
  head_node:
    instance_type: m5.8xlarge
    resources:
      CPU: 0
      GPU: 0
  worker_nodes:
    # This example uses A10G GPUs for the VLM model inference, if you need to
    # change the instance type, make sure the vllm config is updated accordingly.
    - instance_type: m5.xlarge
      min_nodes: 2000
      max_nodes: 2000
      # market_type: SPOT
    # - instance_type: m5n.4xlarge
    # min_nodes: 0
    # max_nodes: 16
    # market_type: SPOT
  enable_cross_zone_scaling: false

requirements:
  # - daft==0.6.2
  # - torch==2.7.0
  # - torchvision==0.22.0
  # - numpy==1.26.4

 
# Path to a local directory or a remote URI to a .zip file (S3, GS, HTTP) that
# will be the working directory for the job. The files in the directory will be
# automatically uploaded to the job environment in Anyscale.
working_dir: .

# When empty, this uses the default Anyscale Cloud in your organization.
cloud: anyscale_v2_default_cloud

env_vars:
  ANYSCALE_DISABLE_OPTIMIZED_RAY: "true"
  PROFILER_MODE: "none"          # "nsys", "torch", or "none"
  PYSPY_ENABLED: "0"             # Enable py-spy CPU profiling
  PERF_PROFILING_ENABLED: "1"    # Enable perf record on raylet/gcs
  PERF_NUM_CPU_WORKERS: "5"
  PERF_NUM_GPU_WORKERS: "0"
  PROFILING_STORAGE_DIR: "/mnt/shared_storage"
  PROFILING_STORAGE_TYPE: "s3"   # S3 or GCs at present
  RAY_ray_event_recorder_max_queued_events: "40000"
  RAY_centralized_actor_scheduling: "true"
  # RAY_BACKEND_LOG_LEVEL: "debug"
  # RAY_pull_from_reporter_interval_ms: "20"
  # RAY_raylet_report_resources_period_milliseconds: "20"
  # RAY_gcs_resource_broadcast_max_batch_delay_ms: "5"
  # RAY_gcs_resource_broadcast_max_batch_size: "200"

# The script to run in your job. You can also do "uv run main.py" if you have a
# pyproject.toml file in your working_dir.
#entrypoint: python ray_data_main.py
# entrypoint: python ray_data_main_network_monitor.py
entrypoint: bash -x ./RUNIT

# If there is an error, do not retry.
max_retries: 0

# Kill the job after 2 hours to control costs.
timeout_s: 28800
#flags:
#  allow-cross-zone-autoscaling: true
#  enable_multi_az_serve: true
